/* Мягкий светло-серый фон, почти белые карточки с большими скруглениями,
   размытые цветные градиенты для главных цифр, точечный шрифт для итогов. */
:root {
  --bg: #e9e9ec; --surface: #f7f7f8; --surface-2: #ffffff; --text: #17171a; --muted: #85858d;
  --faint: #b9b9c0; --line: #dcdce1; --lime: #e2f43c; --lime-text: #1b1f00;
  --danger: #d93a3f; --star: #f08a24; --glass: rgba(255,255,255,.72); --glass-line: rgba(255,255,255,.9);
  --shadow: 0 1px 2px rgba(20,20,30,.04), 0 8px 24px rgba(20,20,30,.05);
  --grad-green: radial-gradient(120% 90% at 85% 0%, #f4c89c 0%, rgba(244,200,156,0) 45%),
                linear-gradient(170deg, #c7dc63 0%, #6fbb48 38%, #2f9a3a 70%, #1f7d2e 100%);
  --grad-orange: radial-gradient(110% 100% at 0% 0%, #cdd6df 0%, rgba(205,214,223,0) 50%),
                 linear-gradient(160deg, #f6b46b 0%, #f2872c 55%, #e8681a 100%);
  --font: 'Onest', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-dots: 'Doto', 'Onest', ui-monospace, monospace;
  --nav-h: 76px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111113; --surface: #1c1c1f; --surface-2: #26262a; --text: #f1f1f3; --muted: #8f8f98;
    --faint: #55555c; --line: #2e2e33; --lime: #d8ec34; --lime-text: #1b1f00;
    --danger: #ff6b6f; --star: #f5a04a; --glass: rgba(38,38,42,.72); --glass-line: rgba(255,255,255,.08);
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111113; --surface: #1c1c1f; --surface-2: #26262a; --text: #f1f1f3; --muted: #8f8f98;
  --faint: #55555c; --line: #2e2e33; --lime: #d8ec34; --lime-text: #1b1f00;
  --danger: #ff6b6f; --star: #f5a04a; --glass: rgba(38,38,42,.72); --glass-line: rgba(255,255,255,.08);
  --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 400 18px/1.35 var(--font);
  padding-top: env(safe-area-inset-top);
  padding-bottom: calc(var(--nav-h) + 28px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
main { max-width: 640px; margin: 0 auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
h1 { font-size: 36px; font-weight: 400; letter-spacing: -.025em; margin: 18px 0 2px; text-wrap: balance; }
.subtitle { color: var(--muted); font-size: 16px; margin: 0 0 18px; }
h2 { font-size: 24px; font-weight: 500; letter-spacing: -.015em; margin: 0; text-wrap: balance; }
h3 { font-size: 16px; color: var(--muted); margin: 26px 4px 10px; font-weight: 400; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.dots { font-family: var(--font-dots); font-weight: 800; letter-spacing: -.06em; }
.pill { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 999px;
  font-size: 14px; font-weight: 500; background: var(--bg); color: var(--muted); white-space: nowrap; }
.pill.lime { background: var(--lime); color: var(--lime-text); }

/* Плавающее меню из матового стекла */
nav.tabs {
  position: fixed; z-index: 10; bottom: calc(12px + env(safe-area-inset-bottom));
  left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  max-width: 616px; margin: 0 auto; display: flex; padding: 6px; border-radius: 30px;
  background: var(--glass); border: 1px solid var(--glass-line);
  -webkit-backdrop-filter: blur(22px) saturate(1.4); backdrop-filter: blur(22px) saturate(1.4);
  box-shadow: 0 10px 30px rgba(20,20,30,.12);
}
nav.tabs button {
  position: relative; flex: 1; min-width: 0; height: var(--nav-h); border-radius: 24px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: var(--muted);
}
nav.tabs button svg { width: 26px; height: 26px; }
nav.tabs button.on { color: var(--text); background: var(--surface-2); box-shadow: var(--shadow); }
.badge { position: absolute; top: 8px; left: calc(50% + 6px); background: var(--lime); color: var(--lime-text);
  font-size: 12px; font-weight: 600; min-width: 20px; height: 20px; border-radius: 10px; display: grid; place-items: center; padding: 0 5px; }

/* Кнопки-капсулы */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
  min-height: 60px; border-radius: 999px; font-size: 19px; font-weight: 500;
  background: var(--surface-2); color: var(--text); padding: 12px 22px; box-shadow: var(--shadow);
}
.btn.primary { background: var(--text); color: var(--bg); box-shadow: none; }
.btn.danger { background: transparent; color: var(--danger); box-shadow: inset 0 0 0 1.5px currentColor; }
.btn.ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn:active, .tile:active, .item .main:active, .entry:active { transform: scale(.985); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* Градиентные карточки с главной цифрой */
.glow {
  position: relative; overflow: hidden; border-radius: 34px; color: #fff; padding: 20px 22px 18px;
}
.glow::after { /* точечная сетка внизу карточки */
  content: ""; position: absolute; inset: 60% 0 0 0; pointer-events: none;
  background-image: radial-gradient(circle, rgba(255,255,255,.38) 1.3px, transparent 1.8px);
  background-size: 11px 11px;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 70%); mask-image: linear-gradient(to bottom, transparent, #000 70%);
}
.glow > * { position: relative; z-index: 1; }
.glow .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.glow .label { font-size: 16px; opacity: .92; }
.glow .big { font-size: 92px; line-height: 1; margin-top: 18px; text-shadow: 0 1px 12px rgba(0,0,0,.12); }
.glow .big small { font-family: var(--font); font-weight: 400; font-size: 26px; margin-left: 6px; letter-spacing: 0; }
.glow .cap { font-size: 17px; opacity: .92; margin-top: 4px; }
.total { background: var(--grad-green); margin-bottom: 14px; min-height: 210px; }
.result { background: var(--grad-orange); margin: 14px 0; text-align: left; }
.result .big { font-size: 76px; margin-top: 6px; }

/* Списки: отдельные мягкие строки */
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 2px; min-height: 72px; background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); }
.item .main { flex: 1; min-width: 0; text-align: left; padding: 14px 8px 14px 20px; min-height: 72px; border-radius: 24px; }
.item .name { font-size: 19px; font-weight: 500; overflow-wrap: anywhere; }
.item .sub { font-size: 15px; color: var(--muted); margin-top: 3px; }
.item .val { font-size: 24px; font-weight: 500; white-space: nowrap; letter-spacing: -.01em; }
.item .val small { font-size: 15px; font-weight: 400; color: var(--muted); }
.item .val.end { padding-right: 20px; }
.icon-btn { width: 56px; height: 64px; display: grid; place-items: center; color: var(--faint); flex: none; border-radius: 20px; }
.icon-btn svg { width: 24px; height: 24px; }
.icon-btn.star.on { color: var(--star); }
.icon-btn.circle span { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); color: var(--muted); }
.icon-btn.circle svg { width: 20px; height: 20px; }

<body>
<main id="app"></main>

<nav class="tabs" id="tabs">
  <button data-tab="products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg><span>Продукты</span></button>
  <button data-tab="plate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/></svg><span>Тарелка</span></button>
  <button data-tab="dishes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-1.2 1-1.6 1-3M12 7c0-1.2 1-1.6 1-3M16 7c0-1.2 1-1.6 1-3"/></svg><span>Блюда</span></button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>История</span></button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Настройки</span></button>
</nav>

<script>
'use strict';

/* ---------- Стандартные продукты: [название, углеводы на 100 г] ----------
   Средние значения из справочников. Всегда сверяйтесь с упаковкой. */
const DEFAULT_PRODUCTS = [
  ['Хлеб белый', 49], ['Батон нарезной', 51], ['Хлеб ржаной', 40], ['Хлебцы хрустящие', 60],
  ['Сушки', 69], ['Печенье «Мария»', 71],
  ['Гречка варёная', 20], ['Гречка сухая', 62],
  ['Рис варёный', 28], ['Рис сухой', 78],
  ['Макароны варёные', 30], ['Макароны сухие', 70],
  ['Овсяная каша на воде', 12], ['Овсяные хлопья сухие', 60],
  ['Манная каша на молоке', 15], ['Пшённая каша на воде', 22],
  ['Картофель варёный', 17], ['Картофельное пюре', 15],
  ['Кукуруза варёная', 22], ['Горошек зелёный консервированный', 7],
  ['Морковь', 7], ['Огурец', 3], ['Помидор', 4], ['Капуста белокочанная', 5],
  ['Яблоко', 10], ['Груша', 10], ['Банан', 21], ['Апельсин', 8], ['Мандарин', 8],
  ['Виноград', 16], ['Клубника', 7], ['Арбуз', 8], ['Персик', 10],
  ['Молоко 3,2%', 4.7], ['Кефир', 4], ['Йогурт натуральный', 4], ['Йогурт фруктовый', 13],
  ['Творог 5%', 3], ['Сыр твёрдый', 0], ['Сосиски молочные', 1.5], ['Яйцо', 1],
  ['Курица / мясо / рыба', 0],
  ['Пельмени', 29], ['Блины', 26], ['Сырники', 18],
  ['Сок яблочный', 10], ['Сок апельсиновый', 10],
  ['Мёд', 81], ['Сахар', 100], ['Шоколад молочный', 54], ['Мороженое пломбир', 20],
  ['Кукурузные хлопья', 83]
];

const KEY = 'uglevody.v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const seed = () => DEFAULT_PRODUCTS.map(([name, carbs], i) => ({ id: 'd' + i, name, carbs, fav: false }));

let S = load();
let tab = 'products';
let query = '';
let mode = 'weight';   // в «Продуктах»: 'weight' — вводим вес, 'carbs' — вводим углеводы
let target = '';

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.products)) {
      d.plate ||= []; d.history ||= []; d.dishes ||= []; d.settings ||= { xe: 0 };
      d.pending ||= {}; d.tomb ||= {}; d.since ||= 0; d.synced ||= false;
      return d;
    }
  } catch (e) {}
  return fresh();
}
function fresh() {
  return { products: seed(), dishes: [], plate: [], history: [], settings: { xe: 0 }, pending: {}, tomb: {}, since: 0, synced: false };
}
// Сохраняет данные на телефоне и отмечает, что изменилось, — это уйдёт на сервер
function save() { trackChanges(); persist(); scheduleSync(); }
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Не удалось сохранить данные'); }
}

/* ---------- Синхронизация с сервером ----------
   Каждая запись (продукт, блюдо, запись истории, настройки) хранит время изменения «u».
   Телефон отправляет изменённые записи и получает чужие; при споре побеждает более позднее изменение.
   Тарелка не синхронизируется: у каждого телефона своя. */
const API = 'api.php';
const TOKEN_KEY = 'uglevody.token';
let token = null;
try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {}
let server = token ? 'on' : 'unknown';   // unknown — проверяем; none — сервера нет; login — нужен вход; on — вошли
const syncInfo = { busy: false, last: 0, error: '' };
let seen = new Map();                    // как выглядела каждая запись при последней проверке
let syncTimer;

function records() {
  const r = [];
  S.products.forEach(p => r.push(['product:' + p.id, p]));
  S.dishes.forEach(d => r.push(['dish:' + d.id, d]));
  S.history.forEach(e => r.push(['history:' + e.id, e]));
  r.push(['settings:main', S.settings]);
  return r;
}
const body = rec => JSON.stringify(rec, (k, v) => k === 'u' ? undefined : v);
function snapshot() { seen = new Map(records().map(([k, r]) => [k, body(r)])); }

function trackChanges() {
  const now = Date.now(), current = new Set();
  for (const [key, rec] of records()) {
    current.add(key);
    const b = body(rec);
    if (seen.get(key) !== b) { rec.u = now; S.pending[key] = 1; delete S.tomb[key]; seen.set(key, b); }
  }
  for (const key of [...seen.keys()]) if (!current.has(key)) { S.pending[key] = 1; S.tomb[key] = now; seen.delete(key); }
}

function collectChanges() {
  const map = new Map(records());
  const keys = S.synced ? Object.keys(S.pending) : [...new Set([...map.keys(), ...Object.keys(S.tomb)])];
  return keys.map(key => {
    const i = key.indexOf(':'), kind = key.slice(0, i), id = key.slice(i + 1), rec = map.get(key);
    return rec ? { kind, id, u: rec.u || 0, data: rec } : { kind, id, u: S.tomb[key] || Date.now(), deleted: true };
  });
}

function applyRemote(list) {
  const coll = { product: 'products', dish: 'dishes', history: 'history' };
  const map = new Map(records());
  let changed = false;
  for (const c of list) {
    const key = c.kind + ':' + c.id, local = map.get(key);
    if (S.pending[key] && (local ? (local.u || 0) : (S.tomb[key] || 0)) > c.u) continue;   // наше изменение новее
    if (c.deleted) {
      if (local) {
        if (c.kind !== 'settings') { const a = S[coll[c.kind]]; a.splice(a.indexOf(local), 1); }
        changed = true;
      }
      seen.delete(key);
    } else if (c.data) {
      c.data.u = c.u;
      if (local && body(local) === body(c.data)) local.u = c.u;
      else {
        if (c.kind === 'settings') S.settings = c.data;
        else { const a = S[coll[c.kind]]; if (local) a[a.indexOf(local)] = c.data; else a.push(c.data); }
        changed = true;
      }
      seen.set(key, body(c.data));
    }
    delete S.pending[key]; delete S.tomb[key];
  }
  return changed;
}

function scheduleSync(delay = 1500) {
  if (!token) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sync, delay);
}

async function sync() {
  if (!token || syncInfo.busy) return;
  syncInfo.busy = true; updateSyncStatus();
  try {
    const r = await fetch(API + '?action=sync', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, cache: 'no-store',
      body: JSON.stringify({ token, since: S.since, changes: collectChanges() })
    });
    const j = await r.json().catch(() => null);
    if (r.status === 401) { dropToken(); server = 'login'; showLogin(); return; }
    if (!r.ok || !j) throw new Error((j && j.message) || 'Сервер не ответил');
    const changed = applyRemote(j.changes || []);
    S.since = j.seq; S.synced = true; persist();
    syncInfo.last = Date.now(); syncInfo.error = '';
    if (changed && !$('#overlay') && !(document.activeElement && document.activeElement.matches('input'))) render();
  } catch (e) {
    syncInfo.error = navigator.onLine === false ? 'Нет интернета — отправлю изменения, когда он появится' : 'Не удалось связаться с сервером — попробую позже';
  } finally {
    syncInfo.busy = false; updateSyncStatus();
    if (!syncInfo.error && Object.keys(S.pending).length) scheduleSync(500);
  }
}

function updateSyncStatus() {
  const el = $('#syncStatus');
  if (!el) return;
  el.textContent = syncInfo.busy ? 'Обмениваюсь данными с сервером…'
    : syncInfo.error ? syncInfo.error
    : syncInfo.last ? `Всё сохранено на сервере · ${new Date(syncInfo.last).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}`
    : 'Ещё не синхронизировано';
}

function dropToken() { token = null; try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} }

// Экран входа по семейному паролю
function showLogin(info = {}) {
  closeSheet(); $('#login')?.remove();
  const el = document.createElement('div');
  el.id = 'login'; el.className = 'login';
  el.innerHTML = `<form class="login-box" id="loginForm">
    <div class="glow total" style="min-height:0">
      <div class="label">Углеводы</div>
      <div style="font-size:30px;font-weight:400;letter-spacing:-.02em;margin-top:56px;max-width:20ch">Общие продукты, блюда и история для всей семьи</div>
    </div>
    <h1 style="margin-top:22px">Вход</h1>
    <p class="subtitle">Введите семейный пароль. Его нужно ввести один раз на каждом телефоне.</p>
    ${info.configured === false ? `<p class="note" style="color:var(--danger)">На сервере ещё не задан пароль. Откройте на хостинге файл config.php и впишите свой пароль.</p>` : ''}
    <input class="field" id="lpass" type="password" autocomplete="current-password" placeholder="Семейный пароль">
    <p class="note" id="lerr" style="color:var(--danger);min-height:20px"></p>
    <div class="stack">
      <button class="btn primary" type="submit" id="lgo">Войти</button>
      <button class="btn ghost" type="button" id="lskip">Пока без входа</button>
    </div>
    <p class="note">Без входа данные хранятся только на этом телефоне. Войти можно позже в «Настройках».</p>
  </form>`;
  document.body.appendChild(el);
  $('#lskip').onclick = () => { el.remove(); server = 'login'; render(); };
  $('#loginForm').onsubmit = async e => {
    e.preventDefault();
    const btn = $('#lgo'), err = $('#lerr');
    btn.disabled = true; btn.textContent = 'Вхожу…'; err.textContent = '';
    try {
      const r = await fetch(API + '?action=login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('#lpass').value }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.token) throw new Error(j.message || 'Сервер не ответил');
      token = j.token;
      try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
      server = 'on'; S.synced = false; S.since = 0; persist();
      el.remove(); render(); toast('Вход выполнен, загружаю данные');
      await sync();
    } catch (ex) {
      err.textContent = navigator.onLine === false ? 'Нет интернета. Подключитесь и попробуйте снова' : ex.message;
      btn.disabled = false; btn.textContent = 'Войти';
    }
  };
  setTimeout(() => $('#lpass')?.focus(), 50);
}

async function checkServer() {
  try {
    const r = await fetch(API + '?action=ping', { cache: 'no-store' });
    const j = await r.json();
    if (j.app !== 'uglevody') throw 0;
    server = 'login'; showLogin(j);
  } catch (e) { server = 'none'; }
}

function logout() {
  askConfirm('Выйти на этом телефоне? Данные останутся на сервере, а с телефона удалятся.', 'Выйти', () => {
    const t = token;
    fetch(API + '?action=logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: t }) }).catch(() => {});
    dropToken(); S = fresh(); persist(); snapshot(); server = 'login';
    tab = 'products'; render(); showLogin();
  });
}

addEventListener('online', () => scheduleSync(100));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') scheduleSync(100); });
setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 60000);
// Просим телефон не удалять данные приложения при нехватке места.
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ---------- Помощники ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (Math.round(n * 10) / 10).toLocaleString('ru-RU', { maximumFractionDigits: 1 });
const num = s => { const v = parseFloat(String(s).replace(',', '.').replace(/\s/g, '')); return isFinite(v) && v >= 0 ? v : NaN; };
const carbsOf = (carbs100, grams) => carbs100 * grams / 100;
const plateTotal = items => items.reduce((a, i) => a + carbsOf(i.carbs, i.grams), 0);
const xeText = c => S.settings.xe ? `≈ ${fmt(c / S.settings.xe)} ХЕ` : '';
const plural = (n, one, few, many) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many; };
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const byName = (a, b) => a.name.localeCompare(b.name, 'ru');
// Блюда хранятся отдельно, но в списках и в тарелке ведут себя как продукты
const product = id => S.products.find(p => p.id === id) || S.dishes.find(d => d.id === id);
const readyDishes = () => S.dishes.filter(d => d.items.length);

const ICON = {
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.8 6.3.8-4.6 4.4 1.2 6.3L12 17l-5.7 3.1 1.2-6.3L2.9 9.4l6.3-.8z"/></svg>',
  starO: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.8l2.8 5.8 6.3.8-4.6 4.4 1.2 6.3L12 17l-5.7 3.1 1.2-6.3L2.9 9.4l6.3-.8z"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>'
};

/* ---------- Отрисовка ---------- */
function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const plateBtn = $('#tabs [data-tab="plate"]');
  plateBtn.querySelector('.badge')?.remove();
  if (S.plate.length) plateBtn.insertAdjacentHTML('beforeend', `<span class="badge">${S.plate.length}</span>`);
  ({ plate: renderPlate, products: renderProducts, dishes: renderDishes, history: renderHistory, settings: renderSettings })[tab]();
}

// Только список: обновляется при вводе, не сбивая курсор в полях
function renderProductList() {
  const q = query.trim().toLowerCase();
  const need = mode === 'carbs' ? num(target) : NaN;
  const list = [...S.products, ...readyDishes()].filter(p => !q || p.name.toLowerCase().includes(q));
  const favs = list.filter(p => p.fav).sort(byName), rest = list.filter(p => !p.fav).sort(byName);
  const row = p => {
    let val = '', grams = '';
    if (mode === 'carbs') {
      if (!p.carbs) val = `<div class="val end"><span class="pill">нет углеводов</span></div>`;
      else if (need > 0) {
        const g = Math.round(need * 100 / p.carbs);
        grams = ` data-grams="${g}"`;
        val = `<div class="val end num">${g.toLocaleString('ru-RU')} <small>г</small></div>`;
      }
    }
    return `
    <div class="item">
      <button class="icon-btn star ${p.fav ? 'on' : ''}" data-fav="${p.id}" aria-label="Избранное">${p.fav ? ICON.star : ICON.starO}</button>
      <button class="main" data-open="${p.id}"${grams} style="padding-left:0">
        <div class="name">${esc(p.name)}</div>
        <div class="sub num">${p.items ? 'блюдо · ' : ''}${fmt(p.carbs)} г углеводов в 100 г</div>
      </button>
      ${val || `<button class="icon-btn" data-editp="${p.id}" aria-label="Изменить">${ICON.edit}</button>`}
    </div>`;
  };
  let h = '';
  if (mode === 'carbs') h += need > 0
    ? `<p class="note" style="margin:0 6px 4px">Справа — сколько граммов дать, чтобы получилось ${fmt(need)} г углеводов</p>`
    : `<p class="note" style="margin:0 6px 4px">Рядом с каждым продуктом появится нужный вес</p>`;
  else h += `<button class="btn" id="addProduct">+ Добавить свой продукт</button>`;
  if (favs.length) h += `<h3>Избранное</h3><div class="list">${favs.map(row).join('')}</div>`;
  if (rest.length) h += `<h3>${favs.length ? 'Остальные' : 'Все продукты'}</h3><div class="list">${rest.map(row).join('')}</div>`;
  if (!list.length) h += `<div class="empty"><b>Ничего не найдено</b>Такого продукта ещё нет в списке</div>
    <button class="btn primary" data-add-product>+ Добавить «${esc(cap(query.trim()))}»</button>`;
  $('#plist').innerHTML = h;
}

function renderHistory() {
  let h = `<h1>История</h1><p class="subtitle">Что и сколько было дано</p>`;
  if (!S.history.length) {
    $('#app').innerHTML = h + `<div class="empty"><b>Пока пусто</b>Соберите тарелку и нажмите «Записать в историю»</div>`;
    return;
  }
  const sorted = [...S.history].sort((a, b) => b.ts - a.ts);
  const days = new Map();
  sorted.forEach(e => { const k = new Date(e.ts).toDateString(); if (!days.has(k)) days.set(k, []); days.get(k).push(e); });
  for (const [k, entries] of days) {
    const dayTotal = entries.reduce((a, e) => a + plateTotal(e.items), 0);
    h += `<div class="day-head"><h3>${dayLabel(new Date(k))}</h3><span class="pill num">за день ${fmt(dayTotal)} г</span></div>`;
    h += entries.map(e => {
      const t = plateTotal(e.items);
      return `<button class="entry" data-entry="${e.id}">
        <div class="top"><span class="time num">${new Date(e.ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}</span>
          <span class="pill lime num">${fmt(t)} г${S.settings.xe ? ` · ${xeText(t).replace('≈ ', '')}` : ''}</span></div>
        <ul>${e.items.map(i => `<li><span>${esc(i.name)} · ${fmt(i.grams)} г</span><span class="num">${fmt(carbsOf(i.carbs, i.grams))} г</span></li>`).join('')}</ul>
      </button>`;
    }).join('');
  }
  $('#app').innerHTML = h;
}

function dayLabel(d) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - new Date(d).setHours(0, 0, 0, 0)) / 864e5);
  if (diff === 0) return 'Сегодня';
  if (diff === 1) return 'Вчера';
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: d.getFullYear() === today.getFullYear() ? undefined : 'numeric' });
}

let dishId = null;   // какое блюдо открыто в редакторе

// Считает итог блюда и углеводы на 100 г готового блюда
function recalcDish(m) {
  m.items.forEach(i => { const p = S.products.find(x => x.id === i.pid); if (p) { i.carbs = p.carbs; i.name = p.name; } });
  m.total = plateTotal(m.items);
  const weight = m.items.reduce((a, i) => a + i.grams, 0);
  const ready = m.cooked || weight;
  m.carbs = ready ? m.total * 100 / ready : 0;
  return weight;
}

function closeDish() {
  const m = product(dishId);
  if (m && !m.items.length && !m.name.trim()) S.dishes = S.dishes.filter(x => x !== m);
  else if (m && !m.name.trim()) m.name = 'Блюдо без названия';
  dishId = null; save(); render(); scrollTo(0, 0);
}

// Вес продукта в блюде: новый (pid) или уже добавленный (index)
function openIngredient(pid, index) {
  const m = product(dishId);
  const editing = index != null;
  const it = editing ? m.items[index] : S.products.find(p => p.id === pid);
  if (!it) return;
  const sh = openSheet(`
    <div class="sheet-head"><h2>${esc(it.name)}</h2>
      <button class="icon-btn circle" id="iclose" aria-label="Закрыть"><span>${ICON.x}</span></button></div>
    <div class="sheet-sub"><span class="pill num" style="background:var(--surface)">${fmt(it.carbs)} г углеводов в 100 г</span></div>
    <div class="grams"><input id="ig" inputmode="decimal" placeholder="0" autocomplete="off" value="${editing ? fmt(it.grams) : ''}"><span>г</span></div>
    <div class="chips">${[50, 100, 200, 500].map(v => `<button data-ig="${v}">${v}</button>`).join('')}</div>
    <div class="glow result"><div class="label">Углеводов</div><div class="big dots num"><span id="ires">0</span><small>г</small></div></div>
    ${editing
      ? `<div class="row2"><button class="btn danger" id="iremove">Убрать</button><button class="btn primary" id="iok">Сохранить</button></div>`
      : `<button class="btn primary" id="iok">Добавить в блюдо</button>`}`);
  const g = sh.querySelector('#ig');
  const upd = () => { const v = num(g.value); sh.querySelector('#ires').textContent = fmt(isNaN(v) ? 0 : carbsOf(it.carbs, v)); };
  g.addEventListener('input', upd);
  g.addEventListener('keydown', e => { if (e.key === 'Enter') sh.querySelector('#iok').click(); });
  sh.querySelectorAll('[data-ig]').forEach(b => b.onclick = () => { g.value = b.dataset.ig; upd(); });
  sh.querySelector('#iclose').onclick = closeSheet;
  sh.querySelector('#iok').onclick = () => {
    const v = num(g.value);
    if (isNaN(v) || v <= 0) { g.focus(); toast('Введите вес в граммах'); return; }
    if (editing) it.grams = v;
    else m.items.push({ pid: it.id, name: it.name, carbs: it.carbs, grams: v });
    save(); closeSheet(); render();
  };
  if (editing) sh.querySelector('#iremove').onclick = () => { closeSheet(); removeIngredient(index); };
  upd(); g.focus();
}

function removeIngredient(i) {
  const m = product(dishId);
  const [it] = m.items.splice(i, 1); save(); render();
  toast(`Убрано: ${it.name}`, 'Вернуть', () => { m.items.splice(i, 0, it); save(); render(); });
}

function openSheet(html) {
  closeSheet();
  const o = document.createElement('div');
  o.className = 'overlay'; o.id = 'overlay';
  o.innerHTML = `<div class="sheet" role="dialog">${html}</div>`;
  o.addEventListener('click', e => { if (e.target === o) closeSheet(); });
  document.body.appendChild(o);
  return o.firstChild;
}

    <div class="grams"><input id="g" inputmode="decimal" placeholder="0" autocomplete="off" value="${editing ? fmt(it.grams) : prefill ? prefill : ''}"><span>г</span></div>
    <div class="chips">${[50, 100, 150, 200].map(v => `<button data-g="${v}">${v}</button>`).join('')}</div>
    <div class="glow result"><div class="label">Углеводов в порции</div><div class="big dots num"><span id="res">0</span><small>г</small></div><div class="cap" id="cap"></div></div>
    ${editing
      ? `<div class="row2"><button class="btn danger" id="premove">Убрать</button><button class="btn primary" id="pok">Сохранить</button></div>`
      : `<button class="btn primary" id="pok">Добавить в тарелку</button>`}`);
  const g = sh.querySelector('#g');
  const upd = () => {
    const v = num(g.value), c = isNaN(v) ? 0 : carbsOf(carbs, v);
    sh.querySelector('#res').textContent = fmt(c);
    sh.querySelector('#cap').textContent = S.settings.xe ? xeText(c) : '';
  };
  g.addEventListener('input', upd);
  g.addEventListener('keydown', e => { if (e.key === 'Enter') sh.querySelector('#pok').click(); });
  sh.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { g.value = b.dataset.g; upd(); });
  sh.querySelector('#pclose').onclick = closeSheet;
  if (p) sh.querySelector('#pfav').onclick = e => {
    p.fav = !p.fav; save();
    e.currentTarget.classList.toggle('on', p.fav); e.currentTarget.innerHTML = p.fav ? ICON.star : ICON.starO;
    render();
  };
  sh.querySelector('#pok').onclick = () => {
    const v = num(g.value);
    if (isNaN(v) || v <= 0) { g.focus(); toast('Введите вес в граммах'); return; }
    if (editing) S.plate[plateIndex].grams = v;
    else S.plate.push({ pid: p.id, name: p.name, carbs: p.carbs, grams: v });
    save(); closeSheet();
    if (!editing) { tab = 'plate'; toast(`Добавлено: ${p.name}`); }
    render();
  };
  if (editing) sh.querySelector('#premove').onclick = () => { closeSheet(); removePlate(plateIndex); };
  upd();
  g.focus();
}

// Добавление и изменение продукта
// opts.name — подставить название, opts.onSave — что сделать с новым продуктом (например, сразу добавить в блюдо)
function openProductForm(pid, opts = {}) {
  const p = pid ? product(pid) : null;
  const preName = cap((opts.name ?? query).trim());
  const sh = openSheet(`
    <div class="sheet-head"><h2>${p ? 'Изменить продукт' : 'Новый продукт'}</h2>
      <button class="icon-btn circle" id="fclose" aria-label="Закрыть"><span>${ICON.x}</span></button></div>
    <label class="lbl" for="fname">Название</label>
    <input class="field" id="fname" value="${p ? esc(p.name) : esc(preName)}" autocomplete="off" placeholder="Например, Каша «Малышка»">
    <label class="lbl" for="fcarbs">Углеводы на 100 г (смотрите на упаковке)</label>
    <input class="field" id="fcarbs" inputmode="decimal" value="${p ? fmt(p.carbs) : ''}" placeholder="0" autocomplete="off">
    <div class="stack" style="margin-top:18px">
      <button class="btn primary" id="fsave">Сохранить</button>
      ${p ? `<button class="btn danger" id="fdel">Удалить продукт</button>` : ''}
    </div>`);
  sh.querySelector('#fclose').onclick = closeSheet;
  sh.querySelector('#fsave').onclick = () => {
    const name = sh.querySelector('#fname').value.trim();
    const carbs = num(sh.querySelector('#fcarbs').value);
    if (!name) { sh.querySelector('#fname').focus(); toast('Введите название'); return; }
    if (isNaN(carbs) || carbs > 100) { sh.querySelector('#fcarbs').focus(); toast('Введите число от 0 до 100'); return; }
    if (p) { p.name = name; p.carbs = carbs; save(); closeSheet(); render(); toast('Сохранено'); return; }
    const np = { id: uid(), name, carbs, fav: false };
    S.products.push(np); save(); closeSheet();
    if (opts.onSave) { render(); opts.onSave(np); return; }
    if (tab === 'products') query = name;   // сразу показать новый продукт в списке
    render(); toast('Продукт добавлен');
  };
  if (p) sh.querySelector('#fdel').onclick = () => {
    askConfirm(`Удалить «${p.name}»?`, 'Удалить', () => { S.products = S.products.filter(x => x !== p); save(); render(); });
  };
  if (!p) sh.querySelector(preName.trim() ? '#fcarbs' : '#fname').focus();
}

// Запись истории: изменить время, повторить, удалить
function openEntry(id) {
  const e = S.history.find(x => x.id === id);
  if (!e) return;
  const d = new Date(e.ts), pad = n => String(n).padStart(2, '0');
  const local = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const sh = openSheet(`
    <div class="sheet-head"><h2>Запись · ${fmt(plateTotal(e.items))} г</h2>
      <button class="icon-btn circle" id="eclose" aria-label="Закрыть"><span>${ICON.x}</span></button></div>
    <label class="lbl" for="etime">Дата и время</label>
    <input class="field" id="etime" type="datetime-local" value="${local}">
    <div class="stack" style="margin-top:18px">
      <button class="btn primary" id="esave">Сохранить время</button>
      <button class="btn" id="erepeat">Положить снова в тарелку</button>
      <button class="btn danger" id="edel">Удалить запись</button>
    </div>`);
  sh.querySelector('#eclose').onclick = closeSheet;
  sh.querySelector('#esave').onclick = () => {
    const t = new Date(sh.querySelector('#etime').value).getTime();
    if (!isNaN(t)) { e.ts = t; save(); }
    closeSheet(); render();
  };
  sh.querySelector('#erepeat').onclick = () => {
    S.plate.push(...e.items.map(i => ({ ...i }))); save(); closeSheet();
    tab = 'plate'; render(); toast('Продукты в тарелке — проверьте вес');
  };
  sh.querySelector('#edel').onclick = () => {
    askConfirm('Удалить эту запись?', 'Удалить', () => { S.history = S.history.filter(x => x !== e); save(); render(); });
  };
}

// Подтверждение опасного действия
function askConfirm(msg, okLabel, fn) {
  const sh = openSheet(`<h2 style="margin:8px 0 18px">${esc(msg)}</h2>
    <div class="row2"><button class="btn ghost" id="cno">Отмена</button><button class="btn danger" id="cyes">${esc(okLabel)}</button></div>`);
  sh.querySelector('#cno').onclick = closeSheet;
  sh.querySelector('#cyes').onclick = () => { closeSheet(); fn(); };
}

/* ---------- Действия ---------- */
function removePlate(i) {
  const [it] = S.plate.splice(i, 1); save(); render();
  toast(`Убрано: ${it.name}`, 'Вернуть', () => { S.plate.splice(i, 0, it); save(); render(); });
}

let toastTimer;
function toast(msg, action, fn) {
  $('.toast')?.remove(); clearTimeout(toastTimer);
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action)}</button>` : ''}`;
  if (action) t.querySelector('button').onclick = () => { t.remove(); fn(); };
  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), action ? 5000 : 2200);
}

async function exportData() {
  const stamp = new Date().toISOString().slice(0, 10);
  const file = new File([JSON.stringify(S, null, 1)], `uglevody-${stamp}.json`, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Углеводы — копия' }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.products)) throw 0;
      askConfirm('Заменить все текущие данные данными из копии?', 'Заменить', () => {
        S = { products: d.products, dishes: d.dishes || [], plate: d.plate || [], history: d.history || [], settings: d.settings || { xe: 0 },
          pending: S.pending, tomb: S.tomb, since: S.since, synced: S.synced };
        save(); render(); toast('Данные загружены');
      });
    } catch (e) { toast('Это не файл копии приложения'); }
  };
  r.readAsText(file);
}

document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  const d = t.dataset;
  if (d.tab === 'dishes' && tab === 'dishes' && dishId) { closeSheet(); closeDish(); }
  else if (d.tab) { tab = d.tab; closeSheet(); render(); scrollTo(0, 0); }
  else if (d.go) { tab = d.go; render(); scrollTo(0, 0); }
  else if (d.open) openPortion(d.open, null, d.grams ? +d.grams : null);
  else if (d.mode) { mode = d.mode; renderProducts(); if (mode === 'carbs' && !target) $('#target').focus(); }
  else if (d.editPlate != null) openPortion(null, +d.editPlate);
  else if (d.removePlate != null) removePlate(+d.removePlate);
  else if (d.fav) { const p = product(d.fav); p.fav = !p.fav; save(); render(); }
  else if (d.editp) { if (product(d.editp)?.items) { dishId = d.editp; tab = 'dishes'; render(); scrollTo(0, 0); } else openProductForm(d.editp); }
  else if (d.dish) { dishId = d.dish; render(); scrollTo(0, 0); }
  else if (d.ing != null) openIngredient(null, +d.ing);
  else if (d.ingRemove != null) removeIngredient(+d.ingRemove);
  else if (d.pickNew != null) openProductForm(null, { name: pickQuery, onSave: np => openIngredient(np.id) });
  else if (d.pick) openIngredient(d.pick);
  else if (d.addProduct != null) openProductForm();
  else if (t.id === 'newDish') { const m = { id: 'm' + uid(), name: '', items: [], cooked: 0, fav: false, carbs: 0, total: 0 }; S.dishes.push(m); save(); dishId = m.id; render(); $('#dname').focus(); }
  else if (t.id === 'dishBack' || t.id === 'dishDone') closeDish();
  else if (t.id === 'addIng') openPicker();
  else if (t.id === 'dishPortion') { const m = product(dishId); if (m.items.length) openPortion(m.id); else toast('Сначала добавьте продукты'); }
  else if (t.id === 'dishDel') { const m = product(dishId); askConfirm(`Удалить блюдо «${m.name || 'без названия'}»?`, 'Удалить', () => { S.dishes = S.dishes.filter(x => x !== m); dishId = null; save(); render(); }); }
  else if (d.entry) openEntry(d.entry);
  else if (d.xe != null) { S.settings.xe = +d.xe; save(); render(); }
  else if (t.id === 'addProduct') openProductForm();
  else if (t.id === 'savePlate') {
    const entry = { id: uid(), ts: Date.now(), items: S.plate.map(i => ({ ...i })) };
    const prev = S.plate;
    S.history.push(entry); S.plate = []; save(); render();
    toast(`Записано: ${fmt(plateTotal(entry.items))} г`, 'Отменить', () => {
      S.history = S.history.filter(x => x !== entry); S.plate = prev; save(); render();
    });
  }
  else if (t.id === 'clearPlate') {
    const prev = S.plate; S.plate = []; save(); render();
    toast('Тарелка очищена', 'Вернуть', () => { S.plate = prev; save(); render(); });
  }
  else if (t.id === 'exportBtn') exportData();
  else if (t.id === 'syncNow') sync();
  else if (t.id === 'logoutBtn') logout();
  else if (t.id === 'loginBtn') showLogin();
  else if (t.id === 'importBtn') $('#importFile').click();
  else if (t.id === 'restoreDefaults') {
    const names = new Set(S.products.map(p => p.name));
    const missing = seed().filter(p => !names.has(p.name)).map(p => ({ ...p, id: uid() }));
    S.products.push(...missing); save();
    toast(missing.length ? `Возвращено продуктов: ${missing.length}` : 'Все стандартные продукты на месте');
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    query = e.target.value; renderProductList();
  } else if (e.target.id === 'target') {
    target = e.target.value; renderProductList();
  } else if (e.target.id === 'isearch') {
    renderPickList(e.target.value);
  } else if (e.target.id === 'dname') {
    product(dishId).name = e.target.value; save();
  } else if (e.target.id === 'dcooked') {
    const m = product(dishId), v = num(e.target.value);
    m.cooked = v > 0 ? v : 0; recalcDish(m); save(); updateDishNumbers(m);
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'importFile' && e.target.files[0]) importData(e.target.files[0]);
});

snapshot();
render();
if (token) sync(); else checkServer();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
